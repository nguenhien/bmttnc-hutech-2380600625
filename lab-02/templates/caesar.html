<!DOCTYPE html>
<html lang="en">
<head>
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container">
        <table class="table">
            <tr>
                <td style="text-align: center; font-weight: bold; font-size: 25px;">
                    CAESAR CIPHER ------ Nguyễn Minh Hiển 2380600625
                </td>
            </tr>

            <tr>
                <td style="font-weight: bold; color: blue">
                    ENCRYPTION
                </td>
            </tr>

            <tr>
                <td>
                    <form method="POST" action="/encrypt" onsubmit="return validateEncrypt()">
                        <div class="mb-3">
                            <label class="form-label">Plain text:</label>
                            <input
                                type="text"
                                class="form-control"
                                name="inputPlainText"
                                placeholder="Input Plain Text"
                                required
                                autofocus
                            />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input
                                type="number"
                                class="form-control"
                                name="inputKeyPlain"
                                min="1"
                                placeholder="Input Key"
                                required
                            />
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Encrypt
                        </button>
                    </form>
                </td>
            </tr>

            <tr>
                <td style="font-weight: bold; color: blue">
                    DECRYPTION
                </td>
            </tr>

            <tr>
                <td>
                    <form method="POST" action="/decrypt" onsubmit="return validateDecrypt()">
                        <div class="mb-3">
                            <label class="form-label">Cipher text:</label>
                            <input
                                type="text"
                                class="form-control"
                                name="inputCipherText"
                                placeholder="Input Cipher Text"
                                required
                            />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input
                                type="number"
                                class="form-control"
                                name="inputKeyCipher"
                                min="1"
                                placeholder="Input Key"
                                required
                            />
                        </div>

                        <button type="submit" class="btn btn-success">
                            Decrypt
                        </button>
                    </form>
                </td>
            </tr>
        </table>
    </div>

    <script>
        function validateEncrypt() {
            let key =
                document.getElementsByName("inputKeyPlain")[0].value.trim();

            if (key === "") {
                alert("Vui lòng nhập khóa!");
                return false;
            }

            if (parseInt(key) <= 0) {
                alert("Khóa Caesar phải là số nguyên dương lớn hơn 0!");
                return false;
            }

            return true;
        }

        function validateDecrypt() {
            let key =
                document.getElementsByName("inputKeyCipher")[0].value.trim();

            if (key === "") {
                alert("Vui lòng nhập khóa!");
                return false;
            }

            if (parseInt(key) <= 0) {
                alert("Khóa Caesar phải là số nguyên dương lớn hơn 0!");
                return false;
            }

            return true;
        }
    </script>
</body>
</html>
